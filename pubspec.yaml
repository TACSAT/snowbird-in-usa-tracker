name: snowbird_in_usa_tracker
description: "Privacy-first, on-device US trip record-keeper and planner for snowbirds. No cloud, no account, no tracking — just accurate day counts and a printable trip log."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # EN: intl is pinned to align with the version shipped by flutter_localizations.
  #     If `flutter pub get` reports a conflict, update this to match the SDK's pin.
  # FR: intl est épinglé pour correspondre à la version livrée par flutter_localizations.
  #     En cas de conflit au `flutter pub get`, mettre à jour pour correspondre au SDK.
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  # EN: Local, on-device scheduled notifications for user-defined alert targets.
  #     No push service, no network — notifications are computed and scheduled
  #     entirely on the device, consistent with the privacy invariants.
  #     timezone + flutter_timezone provide the IANA database and the device's
  #     current zone so "09:00 local" stays correct across travel and DST.
  # FR: Notifications locales planifiées sur l'appareil pour les cibles d'alerte
  #     définies par l'utilisateur. Aucun service push, aucun réseau — les
  #     notifications sont calculées et planifiées entièrement sur l'appareil,
  #     conformément aux invariants de confidentialité. timezone +
  #     flutter_timezone fournissent la base IANA et le fuseau courant de
  #     l'appareil pour que « 9 h locale » reste correct malgré les voyages et
  #     les changements d'heure.
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  # EN: Provider is the state-management layer between the UI and TripRepository.
  #     Lightweight ChangeNotifier approach — no code generation, no magic.
  # FR: Provider est la couche de gestion d'état entre l'interface et TripRepository.
  #     Approche ChangeNotifier légère — pas de génération de code, pas de magie.
  provider: ^6.1.2
  # EN: UUID generates locally-created, collision-resistant trip IDs without any
  #     network call or external service — required for the offline-first design.
  # FR: UUID génère des identifiants de séjour locaux sans collision et sans appel
  #     réseau ni service externe — indispensable pour la conception hors-ligne.
  uuid: ^4.4.0
  # EN: The flagship "US Presence Record" export (PLAN.md FR-8). `printing` builds
  #     the PDF, rasterises it to a PNG image, and drives the system PRINT dialog;
  #     `share_plus` hands the CSV / image / PDF file to the OS share sheet. Both
  #     were verified to declare NO Android permissions (no INTERNET) — the export
  #     is entirely on-device. IMPORTANT: never call `PdfGoogleFonts.*` — that is
  #     the one code path in `printing` that would fetch a font over the network;
  #     we use the Roboto faces bundled in assets/fonts (NFR-1).
  # FR: L'export de la « fiche de présence aux É.-U. » vedette (PLAN.md FR-8).
  #     `printing` construit le PDF, le pixellise en image PNG et pilote la boîte
  #     de dialogue d'IMPRESSION du système ; `share_plus` remet le fichier CSV /
  #     image / PDF à la feuille de partage de l'OS. Les deux ont été vérifiés : ils
  #     ne déclarent AUCUNE permission Android (pas d'INTERNET) — l'export est
  #     entièrement sur l'appareil. IMPORTANT : ne jamais appeler `PdfGoogleFonts.*`
  #     — c'est le seul chemin de `printing` qui téléchargerait une police par le
  #     réseau ; nous utilisons les polices Roboto de assets/fonts (NFR-1).
  printing: ^5.14.3
  share_plus: ^13.2.0
  # EN: `pdf` builds the document; it ships transitively with `printing`, but we
  #     import it directly (pw.Document, PdfColors, PdfPageFormat) so it is listed
  #     explicitly.
  # FR: `pdf` construit le document ; il arrive de façon transitive avec `printing`,
  #     mais nous l'importons directement (pw.Document, PdfColors, PdfPageFormat),
  #     donc il est listé explicitement.
  pdf: ^3.11.0
  # EN: `package_info_plus` reads the app's own version + build number from the
  #     installed bundle for the About screen (FR-18) — a local metadata read, no
  #     network. `url_launcher` opens the feedback/donate links in the OS browser
  #     (FR-16); the launching app needs no INTERNET permission because the browser,
  #     not this app, makes the request. Both verified against the release manifest.
  # FR: `package_info_plus` lit la version + le numéro de build de l'appli depuis le
  #     bundle installé pour l'écran À propos (FR-18) — une lecture de métadonnées
  #     locale, sans réseau. `url_launcher` ouvre les liens commentaires/don dans le
  #     navigateur de l'OS (FR-16) ; l'appli lanceuse n'a pas besoin de la permission
  #     INTERNET car c'est le navigateur, pas cette appli, qui fait la requête. Les
  #     deux vérifiés contre le manifeste de release.
  package_info_plus: ^10.2.0
  url_launcher: ^6.3.2
  # EN: The optional app lock (WRK-11): asks the phone's own face, fingerprint or
  #     code check, on the device. Adds USE_BIOMETRIC and USE_FINGERPRINT on
  #     Android (allowed in tools/check_apk_permissions.sh), no INTERNET. Needs
  #     FlutterFragmentActivity, AppCompat themes and NSFaceIDUsageDescription.
  # FR: Le verrouillage facultatif (WRK-11) : demande la vérification du
  #     téléphone (visage, empreinte ou code), sur l'appareil. Ajoute
  #     USE_BIOMETRIC et USE_FINGERPRINT sur Android (permises dans
  #     tools/check_apk_permissions.sh), pas INTERNET. Exige
  #     FlutterFragmentActivity, des thèmes AppCompat et NSFaceIDUsageDescription.
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # EN: Already present transitively; listed so tests may fake the share sheet and
  #     the browser.
  # FR: Déjà présents de façon transitive ; listés pour simuler la feuille de partage
  #     et le navigateur dans les tests.
  plugin_platform_interface: ^2.1.8
  share_plus_platform_interface: ^7.1.0
  url_launcher_platform_interface: ^2.3.2

# Generate localizations from lib/l10n/*.arb (see l10n.yaml).
flutter:
  generate: true
  uses-material-design: true
  # EN: PDF fonts (Apache 2.0, taken from the Flutter SDK) and their license.
  # FR: Polices du PDF (Apache 2.0, tirées du SDK Flutter) et leur licence.
  assets:
    - assets/fonts/
