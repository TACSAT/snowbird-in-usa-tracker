include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # EN: Exclude generated localisation files — they are regenerated by
    #     `flutter gen-l10n` and should not be linted as hand-written code.
    # FR: Exclure les fichiers de localisation générés — ils sont régénérés par
    #     `flutter gen-l10n` et ne doivent pas être analysés comme du code manuel.
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    require_trailing_commas: true
    # EN: Disallow bare print() calls in production code. Use the assert-guarded
    #     pattern `assert(() { print(...); return true; }())` for debug output so
    #     the message is compiled out in release builds and never reaches a log
    #     aggregator or analytics pipeline.
    # FR: Interdire les appels print() nus dans le code de production. Utiliser le
    #     motif protégé par assert `assert(() { print(...); return true; }())` pour
    #     la sortie de débogage, afin que le message soit supprimé en build release
    #     et n'atteigne jamais un agrégateur de journaux ou un pipeline d'analyse.
    avoid_print: true
